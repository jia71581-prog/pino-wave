# Factorized FNO — 128x128x160 smoke test
# At 128x128, spatial_modes=48 gives 48/64=75% spectral coverage.
# spatial_modes=64 gives 100% but 2x compute cost.

seed: 2026

data:
  path: /home/jiayh/Data/data/pino.hdf5
  raw_hdf5: /home/jiayh/Data/data/pino.hdf5
  schema_mode: explicit_after_inspection
  velocity_key: nu
  wavefield_key: tensor
  source_map_key: source_mask
  source_position_x_key: source_x_idx
  source_position_z_key: source_z_idx
  wavelet_key: wavelet
  frequency_key: source_frequency_hz
  amplitude_key: source_amplitude
  time_key: t-coordinate
  x_key: x-coordinate
  z_key: y-coordinate
  dx_key: dx
  velocity_axes: [sample, x, z]
  wavefield_axes: [sample, time, x, z]
  source_map_axes: [sample, x, z]
  source_position_units: index
  input_features: [time, source_map, velocity]
  split_seed: 2026
  split: [0.8, 0.1, 0.1]
  split_manifest: artifacts/manifests/split_v2_seed2026.json
  max_samples: null
  open_hdf5_per_sample: false
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  shuffle_train: true

sampling:
  target_height: 128
  target_width: 128
  max_time_steps: 160
  spatial_method: bilinear_antialias

model:
  name: factorized_fno
  in_features: 3
  out_channels: 1
  spatial_modes_x: 48
  spatial_modes_z: 48
  spatial_width: 32
  spatial_layers: 3
  temporal_width: 32
  temporal_kernel: 7
  temporal_layers: 3
  padding_ratio: 0.0625
  normalization: group
  num_groups: 8
  head_hidden: 128
  temporal_chunk_size: 512

train:
  device: cuda
  init_checkpoint: artifacts/factorized_fno/migrated_64x64_to_128x128.pt
  batch_size: 1
  epochs: 4
  learning_rate: 3.0e-4
  weight_decay: 0.0
  scheduler: cosine
  grad_clip: 1.0
  log_every_steps: 10
  checkpoint_dir: artifacts/factorized_fno/128x128x160_smoke/checkpoints
  log_dir: artifacts/factorized_fno/128x128x160_smoke/logs
  max_train_batches: 8
  max_val_batches: 4
  early_failure_gate:
    enabled: true
    stop_on_failure: false
    min_epochs: 4
    relative_l2_threshold: 0.98
    require_better_than_zero_baseline: true

validation:
  category_balanced:
    enabled: true
    samples_per_category: 2

loss:
  relative_l2_weight: 1.0
  mse_weight: 0.1
  eps: 1.0e-8

normalization:
  stats_path: artifacts/stats/normalization_v2_seed2026_train.json
  reuse_stats: true
  eps: 1.0e-6
