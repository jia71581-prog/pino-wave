seed: 20260710

data:
  path_glob: /home/jiayh/Data/.atan/outputs/real_marmousi_wavefields_500_gpu_20260711_000540/train/shard_*.h5
  schema_mode: elastic_vti_vp_vs_to_displacement
  medium_keys:
    vp: medium/vp_m_s
    vs: medium/vs_m_s
  medium_axes: [sample, x, z]
  wavefield_key: wavefield/displacement_m
  wavefield_axes: [sample, time, component, x, z]
  source_map_key: source/kernel
  source_map_axes: [x, z]
  wavelet_key: source/wavelet
  wavelet_axes: [time]
  frequency_key: meta/source_f0_hz
  source_position_x_key: meta/source_x_m
  source_position_z_key: meta/source_z_m
  source_position_units: m
  time_key: time/wavefield_times_s
  x_key: coordinates/x_m
  z_key: coordinates/z_m
  model_type_key: meta/model_type
  input_features: [time, vp, vs]
  split_seed: 20260710
  split: [0.8, 0.1, 0.1]
  split_manifest: artifacts/elastic_vti_pino_marmousi/splits.json
  max_samples: null
  open_hdf5_per_sample: false
  num_workers: 0
  pin_memory: true
  persistent_workers: false
  shuffle_train: true
  split_output_path: artifacts/elastic_vti_pino_marmousi_optimizer_sweep/lr5e5/splits.json

sampling:
  spatial_stride: null
  target_height: 160
  target_width: 160
  time_start: 0
  time_stop: null
  time_stride: null
  max_time_steps: 101
  spatial_method: bilinear_antialias

source_map:
  sigma_grid: 1.5
  normalize_max: true

normalization:
  velocity: global_standard
  wavefield: global_standard
  stats_path: artifacts/elastic_vti_pino_marmousi/normalization_stats.json
  reuse_stats: true
  eps: 1.0e-16
  max_stats_samples: 16

model:
  name: elastic_vti_fno
  in_features: auto
  out_channels: 2
  modes_x: 14
  modes_z: 14
  modes_t: 14
  width: 22
  n_layers: 4
  padding_ratio: 0.0625
  activation: gelu
  normalization: group

train:
  device: cuda
  init_checkpoint: artifacts/elastic_vti_pino_marmousi/checkpoints/best.pt
  epochs: 3
  batch_size: 1
  log_every_steps: 10
  learning_rate: 5.0e-5
  weight_decay: 1.0e-5
  optimizer: adamw
  scheduler: cosine
  amp: false
  grad_clip: 0.5
  early_stopping_patience: null
  max_train_batches: 64
  max_val_batches: 8
  checkpoint_every_epochs: 1
  checkpoint_dir: artifacts/elastic_vti_pino_marmousi_optimizer_sweep/lr5e5/checkpoints
  log_dir: artifacts/elastic_vti_pino_marmousi_optimizer_sweep/lr5e5/logs

loss:
  relative_l2_weight: 1.0
  mse_weight: 0.0
  grad_weight: 0.0
  pde_weight: 1.0e-4
  pde_normalized: true
  rho_kg_m3: 1000.0
  energy_weight: 1.0e-5
  receiver_weight: 1.0e-3
  receiver:
    x_stride: 8
  eps: 1.0e-16

evaluation:
  split: val
  max_samples: 4
  output_dir: artifacts/elastic_vti_pino_marmousi_optimizer_sweep/lr5e5/evaluation
