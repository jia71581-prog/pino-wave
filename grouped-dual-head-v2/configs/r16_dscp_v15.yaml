  long_1: "env CUBLAS_WORKSPACE_CONFIG=:4096:8 CUDA_VISIBLE_DEVICES=0 PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src:. python scripts/train_r16_dscp_v15.py long --authorization results/r16_dscp_v15/authorizations/long.json --world-size 1 --input-checkpoint BEST --scale-decision results/r16_dscp_v15/scale-decide/terminal.json --config configs/r16_dscp_v15.yaml --preregistration results/r16_dscp_v15_preregistration_20260826.json"
  long_4: "env CUBLAS_WORKSPACE_CONFIG=:4096:8 CUDA_VISIBLE_DEVICES=0,1,2,3 PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src:. torchrun --standalone --nproc-per-node=4 scripts/train_r16_dscp_v15.py long --authorization results/r16_dscp_v15/authorizations/long.json --world-size 4 --input-checkpoint BEST --scale-decision results/r16_dscp_v15/scale-decide/terminal.json --config configs/r16_dscp_v15.yaml --preregistration results/r16_dscp_v15_preregistration_20260826.json"
  final: "env CUBLAS_WORKSPACE_CONFIG=:4096:8 CUDA_VISIBLE_DEVICES=0 PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src:. python scripts/train_r16_dscp_v15.py final-train-confirm --authorization results/r16_dscp_v15/authorizations/final-train-confirm.json"
  validation: "env CUBLAS_WORKSPACE_CONFIG=:4096:8 CUDA_VISIBLE_DEVICES=0 PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src:. python scripts/train_r16_dscp_v15.py validation-once --authorization results/r16_dscp_v15/authorizations/validation-once.json"
  test: "env CUBLAS_WORKSPACE_CONFIG=:4096:8 CUDA_VISIBLE_DEVICES=0 PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src:. python scripts/train_r16_dscp_v15.py test-once --authorization results/r16_dscp_v15/authorizations/test-once.json"
inherited_vetoes:
  - thresholds must not be moved toward measured values
  - no deployment-time truth in the mask, including truth frame energy
  - no cross-record or synthetic-sample oracle constant as an acceptance baseline
  - the smoke loss gate is never learning or convergence evidence
  - the correction is an output-field data fit plus a feature-driven ansatz, not a physics or PDE residual and not deployment-time truth supervision
  - smoke evidence never promotes to pilot or long
rollback: new_files_only_no_existing_file_modified_no_checkpoint_deleted
claim_boundary: parent_speedup_only_1.608x_candidate_must_not_claim_10x_or_faster_than_parent
