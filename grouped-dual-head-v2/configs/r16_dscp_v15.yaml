  authorize_smoke: "env PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src:. python scripts/train_r16_dscp_v15.py authorize-stage --stage smoke --output results/r16_dscp_v15/authorizations/smoke.json --lead-authorized --acknowledge-rule-revision --acknowledge-vetoes"
