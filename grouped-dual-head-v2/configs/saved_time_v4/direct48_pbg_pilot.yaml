# V3 base configuration for the r49 direct48 P_bg pilot (project-train 3-record
# overfit capacity check).  The model section mirrors the r4 direct-frequency
# coefficient-supervision run (continuous_pilot_w128_legacy_norm_marmousi1_4m_v2)
# so the only changed concept variable is the data panel / 48-bin P_bg target.
#
# Data contract: only the fit-panel head (first three train_* sample ids of the
# split manifest) is opened.  calibration/confirmation/validation/test_id are
# never opened.  The wavefield column (P_bg) is used exclusively as train labels.
# The training seed is carried by the run configuration (train.seed), not here.

model:
  width: 128
  spectral_rank: 40
  modes: [20, 16, 12, 8]
  dense_modes: [20, 16]
  mionet_rank: 128
  token_count: 64
  heads: 4
  position_bands: 4
  fourier_bands: 6
  gabor_scales_s: [0.01, 0.025, 0.05, 0.1]
  ray_samples: 12
  dense_time_block: 1
  domain_x_m: 2000.0
  domain_z_m: 2000.0
  domain_t_s: 1.0

data:
  source_h5: artifacts/pbg_factorized_fno_marm700_eikonal_v3/dataset_v1.h5
  manifest_json: artifacts/pbg_factorized_fno_marm700_eikonal_v3/split_full560_70_70_seed372.json
  normalization_json: artifacts/pbg_factorized_fno_marm700_eikonal_v3/normalization_v3_direct48_pbg.json
  expected_train_records: 700
  expected_validation_records: 0
  continuous_fraction: 0.25

loss: {}

train:
  optimizer: adamw
  seed: 372
  device: cuda
