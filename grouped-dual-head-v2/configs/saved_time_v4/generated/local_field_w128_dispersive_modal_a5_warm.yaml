# Per-pixel LEARNED-DISPERSION modal coarse field:
#   coarse(x,z,t) += gate * (1/sqrt(M)) sum_m A_m(x,z) cos(omega_m(x,z) t_rel + phi_m(x,z)).
# SINGLE STRUCTURAL FACTOR vs A3 (temporal_latent): A3 uses generic FIXED-frequency harmonics
# modulated by static anchors; A5 makes each mode's angular frequency omega_m LEARNED PER (x,z)
# (a discrete dispersive/Green modal expansion) so multi-arrival + late reverberation is a
# multi-MODE location-dependent oscillation a single U-Net render / fixed-freq harmonic bank
# cannot encode. Everything else identical: parent=warp_r1 best.pt, LR groups (dispersive_modal
# 5e-5, near-frozen parent dense 5e-6), harmonics->modes=16, gate_init=0.03 (avoids the A3
# cold-start deadlock; see R8), panels, seed.
#
# LAUNCH GATE (pre-registered): DO NOT launch this until the *un-deadlocked* A3-warm has produced
# its own STRICT verdict and FAILED its gate (LAYERED<0.27 AND late<0.30 AND agg<0.235 while
# phase>=0.80). If a WORKING continuous temporal basis (A3-warm) still cannot dent layered/late,
# the generic-basis FORM is proven insufficient and THIS learned-dispersion escalation is the next
# single structural factor. If A3-warm SUCCEEDS, this run is unnecessary (one factor at a time).
# param cost (measured): modes=16 -> 62,305 (1.12% of 5.58M base); activation = 3*M query-independent
# maps once per record, cos-combine frame-chunked so count=401 validation cannot OOM -> fits 23.5 GiB.
#
# MEMORY FEASIBILITY: A5 is param/activation comparable to A3 (which fits 23.5 GiB across 4 ranks);
# the only A5-specific risk (M-fold (R,T,M,H,W) blowup at count=401) is closed by the frame-chunked
# forward (test_frame_chunk_invariance pins it numerically identical). Smoke must still cross >=3
# validation->train boundaries at 4 ranks with no OOM/NaN before the full run.
