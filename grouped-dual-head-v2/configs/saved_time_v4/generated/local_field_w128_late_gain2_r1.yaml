# Long-time strengthening pilot: warm-start gate4 (local-field, 0.306) and turn on
# per-frame + causal late-frame loss reweighting (Change 1, the primary lever for
# the late-frame bottleneck).  gate4 used per_frame_frame=False (record-normalized
# energy -> late frames near-invisible to the gradient); here we normalize per frame
# and up-weight late times so long-time error actually drives training.
artifact_dir: /root/autodl-tmp/home/jiayh/Data/FNO-Acoustic-Wave-Simulation/1/pretraining/local_field_w128_late/gain2_r1
base_config: configs/grouped_v3/continuous_pilot_w128_legacy_norm.yaml
checkpoint_transfer:
  allow_new_local_field_parameters: false
  allow_parent_manifest_mismatch: false
  parent_optimizer_state: false
energy_floor_fraction: 0.01
epochs: 6
family_gradient_weights:
  layered: 1.0
  marmousi: 1.0
  uniform: 1.0
gate:
  external_evidence_gate: false
  family_regression_tolerance: 0.05
  maximum_peak_cuda_gib: 23.5
  pilot_epochs: 6
  target_aggregate_relative_l2: 0.1
  target_family_relative_l2: 0.12
loss:
  delta: 0.5
  delta_energy_floor_fraction: 0.1
  hard_causality: true
  hard_causality_lead_cycles: 1.0
  spatial_gradient: 0.1
  spectrum: 0.1
  temporal_difference: 0.1
  # --- Change 1: late-frame reweighting (primary long-time lever) ---
  per_frame_frame: true              # normalize each frame by its own energy
  frame_energy_floor_fraction: 0.05  # floor so near-zero late frames don't blow up
  late_frame_gain: 2.0               # w(t) = 1 + gain*ramp(t); 0 = uniform per-frame
  late_frame_start_fraction: 0.4     # ramp starts at 40% of the time axis
macro_records: 8
macros_per_update: 4
microbatch_records: 1
optimizer:
  adamw_implementation: fused
  backbone_learning_rate: 2.0e-6
  dense_learning_rate: 5.0e-5
  full_forward_checkpointing: true
  geometry_learning_rate: 1.0e-5
  gradient_clip: 1.0
  gradient_clip_mode: prefix_limits
  gradient_clip_prefix_limits:
    coordinate_encoder: 5.0
    default: 1.0
    dense_decoder: 20.0
    fusion: 5.0
    local_field: 80.0
    medium_encoder: 2.0
    source_encoder: 5.0
    travel_branch: 5.0
  minimum_factor: 0.1
  schedule_epoch_offset: 0
  schedule_total_epochs: 6
  training_time_block: 1
  warmup_epochs: 1
  weight_decay: 1.0e-6
parent_checkpoint: /root/autodl-tmp/home/jiayh/Data/FNO-Acoustic-Wave-Simulation/1/pretraining/local_field_w128_residual/gate6_spectral_r1/run/best.pt
parent_checkpoint_identity: /root/autodl-tmp/home/jiayh/Data/FNO-Acoustic-Wave-Simulation/1/pretraining/local_field_w128_residual/gate6_spectral_r1/run/run_identity.json
parent_identity: /root/autodl-tmp/home/jiayh/Data/FNO-Acoustic-Wave-Simulation/1/pretraining/local_field_w128_residual/w2_parent_identity_legacy_norm.json
prefetch_factor: 4
query_points: 1
seed: 372
time_appearance_offset: 15
time_policy: appearance16
training_frames_per_record: 16
travel_time_h5: /home/jiayh/Data/data/processed/hybrid_travel_layered_eikonal_ray12_v1.h5
validation:
  all_records_every: 3
  final_frames_per_record: 401
  frames_per_record: 32
  full_panel_records: 48
  microbatch_records: 1
  panel_records: 48
variant_overrides:
