# A4 multi_arrival (CLASS-A late-arrival lever): extra delayed/displaced characteristic warps.
#
# STATUS: LAUNCH-READY, NOT YET LAUNCHED. This config is the pre-registered A4 escalation
# branch. Launch ONLY after the A3-rank32 ep12 STRICT verdict frees the decision (and a GPU),
# per the pre-registered escalation ladder. Do NOT contend with the active A3 run.
#
# WHY A4 (class-A late-arrival structure): the strict aggregate is co-dominated by layered +
# marmousi (~79% together; VERIFIED record split l=19 / m=19 / u=10). The binding residual is
# LATE-time (late tbin 0.345 at the warp ceiling) -- reflections / multiples that the r4 single
# first-arrival warp CANNOT place. A4 adds K explicit later-arrival paths: each reuses the shared
# first-arrival characteristic grad(T) (a reflection retraces the same rays), displaced by its own
# bounded shift head and turned on after a learned per-record delay Delta_k, mixed by a zero-init
# scalar gate. This is a genuine STRUCTURAL capacity change on the DOMINANT late error, not a
# loss/LR tweak.
#
# OPTION B WARM-START (byte-reproducible warp ceiling): A4 is ADDITIVE on top of the parent-trained
# local_field.warp -- path 0 stays self.warp (loads unchanged from warp_r1/best.pt), and A4 supplies
# only the EXTRA delayed paths. Every path_gate is zero-init, so at load field_out == field_in
# EXACTLY: the model starts at the loaded 0.2398 warp ceiling and only the fresh multi_arrival.*
# params develop. This resolves the earlier "warp:false would drop the trained path 0" blocker.
#
# MECHANISM (per-frame query invariant BY CONSTRUCTION): for each extra path k,
#   delay_k(x,z)   = max_delay_frac * domain_t_s * sigmoid(delay_head_k(spatial))   # per-record, query-indep
#   causal_k(t)    = sigmoid((t - onset - arrival - delay_k) / causal_width_s)
#   field += path_gate[k] * causal_k * warp_k(field)                                # warp_k reuses grad(T)
# The delay/shift maps depend only on the time-INDEPENDENT record conditioning; each frame uses only
# its own (t, causal_k), so no queried-index-axis mixing (same query-invariance contract as r4/A3).
# Cost over r4: K small shift convs + K grid-samples on the ALREADY-rendered field + K 1x1 delay
# convs -- NO extra U-Net render, same activation-memory envelope as warp_r1 (~23.2 GiB/card).
#
# SINGLE FACTOR vs warp_r1 parent: ONLY local_field_multi_arrival is newly enabled (paths=3). warp,
# residual, harmonics, LR groups, panels identical. warp.* loads unchanged and sits in the dense
# group (5e-6, near-frozen); multi_arrival.* is the ONLY thing developing at full step (own group
# 5e-5). Any movement below the warp ceiling is attributable to A4 alone -- the class-A late-arrival
# sibling of A3 (temporal_latent) and B1 (temporal_operator).
#
# FALSIFICATION (pre-registered, same strict warp reference as A3): vs warp ep12 strict
# (agg 0.2398, LAYERED 0.2878, MARMOUSI 0.2516, late tbin 0.3452, phase 0.7969). A4's goal-relevant
# claim is that explicit later-arrival paths place the late reflections a single warp cannot, so it
# MUST move the DOMINANT layered/marmousi LATE error. Require by the ep12 strict panel:
#   LAYERED family_relative_l2 < 0.27 AND late tbin < 0.30 AND aggregate < 0.235 while phase >= 0.80;
# MARMOUSI < 0.24 co-dominant secondary readout. If layered/late stay pinned at the warp ceiling
# while only the gate twitches, the additive-path form is insufficient on the dominant late error ->
# escalate to an explicit wave-equation / space-time-structured coarse field.
# Unchanged hard goal: agg < 0.05 and every family < 0.08.
# ---------------------------------------------------------------------------------------------
