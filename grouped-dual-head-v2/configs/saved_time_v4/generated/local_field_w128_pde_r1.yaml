# P1 pde_r1: PINN-STYLE WAVE-EQUATION RESIDUAL LOSS (no architecture change).
#
# WHY: r2 (rank-16 temporal operator) and warp_r1 (r4 eikonal characteristic warp)
# are both zero-init adapters bolted onto a FROZEN opt16 parent. The capacity ladder
# (results/capacity_ladder/VERDICT.md) measured ~0% gain for downstream correction on
# the frozen coarse field; both adapters plateaued/regressed at the opt16 floor
# (agg ~0.2449, phase FLAT ~0.797 -- amplitude-only, transport never moved). The
# lever the evidence points to is UPSTREAM (the coarse-field generator) and a
# constraint that directly targets wavefront POSITION/PHASE.
#
# MECHANISM (this run): keep the opt16 architecture EXACTLY (local_field +
# local_field_residual, NO warp, NO temporal operator) so warm-start is a perfect
# no-op, then (i) add a relative, source-free acoustic wave-equation residual
# L_pde = ||u_tt - c^2 lap(u)||^2 / (||u_tt||^2 + ||c^2 lap||^2) computed by finite
# differences on the dense predicted field (non-uniform 3-pt time 2nd-derivative;
# 2nd-order Laplacian in z,x with physical spacings dz=dx=2000/(N-1) m; velocity from
# the medium input), and (ii) UNFREEZE the coarse-field U-Net at a small real LR
# (optimizer.local_field_learning_rate) so the differential constraint can bend the
# field toward an actual wave solution while dense_decoder stays near-frozen (5e-6).
# The PDE penalizes wrong phase/position via the differential operator WITHOUT needing
# frame observations -- exactly the stuck metric (phase_corr ~0.79). This adds ZERO
# parameters and ZERO architecture change vs opt16 -> cheap, warm-startable, falsifiable.
#
# SOURCE-FREE + CAUSALITY masking: hard_causality stays TRUE (it is part of the fixed
# scoring protocol -- applied identically in validation -- so it must not change vs the
# opt16/warp baselines). The residual is masked to interior frame-triples that are
# fully post-onset (the causal edge is a spurious discontinuity, not a physical u_tt)
# AND to cells with eikonal arrival > pde_source_free_onset_s (excludes the source
# injection region where f != 0). Both masks are built in the trainer from tensors
# already in scope (requested_time_s, source params, dense_travel_time_s).
#
# FALSIFICATION: if adding the wave-equation constraint does NOT lower agg below the
# opt16 floor (0.2449 fixed_panel / 0.25300 full_time_panel) AND does NOT raise
# phase_correlation above ~0.80 within ~6-8 epochs, the coarse field cannot be bent
# into a PDE solution by a soft residual at this weight -> escalate to P2 (3D-spacetime
# coarse field, from-scratch) per the standing structural conclusion. Record raw
# metrics + same-protocol baseline + checkpoint + this config identity either way.
#
# Warm-start: opt16 best.pt (agg 0.2449). Architecture identical to the parent ->
# NO new/zero-init params (unlike warp/tempop). local_field co-trains at 2e-5.
