# tempop r3: RECEPTIVE-FIELD pivot on the query-invariant temporal operator.
#
# WHY: tempop_r2 (rank-16 temporal operator, staged-adapter warm-start, pinned parent)
# confirmed a plateau over epochs 1-5: agg flat at the parent floor
# (0.2463/0.2444/0.2453/0.2446, opt16 floor 0.2449), family flat
# (layered ~0.290, marmousi ~0.257, uniform 0.138->0.132). The operator did NOT move
# the aggregate.
#
# STRUCTURAL DIAGNOSIS (code audit): _ContinuousTimePropagationBasis.spatial_coefficient
# was a 1x1 conv (ZERO receptive field). The gated residual could only rescale amplitude
# at each pixel's existing location -- it could NOT translate/advect the wavefront. But
# the confirmed bottleneck is wavefront POSITION/PHASE, so a 1x1 operator is structurally
# incapable of fixing it. That is the clean reason agg sat at the parent floor.
#
# PIVOT (this run): set local_field_temporal_operator_spatial_kernel: 3 -> spatial_coefficient
# becomes a two-layer 3x3 stack (RF = 5), bottlenecked width->rank->rank so the retained
# intermediate stays [R*T, rank, H, W] (memory-frugal; a width-channel 201x201 intermediate
# would add ~5 GiB and blow the 24 GiB card). This gives the ACTIVE (5e-5) operator genuine
# spatial-gather capacity to reposition energy WITHOUT unfreezing/destroying the near-frozen
# parent (dense 5e-6). Zero-init gate keeps warm-start an exact no-op; per-frame operation
# preserves the hard query-invariance contract.
#
# FALSIFICATION: if RF lets agg break below 0.2449 (+ phase/uniform improve), the position
# diagnosis is confirmed and a working lever is found -> train to convergence. If agg stays
# flat at the floor, the continuous-time-basis form is insufficient -> escalate to an
# eikonal-advection corrector (sample rendered field along travel-time characteristics).
#
# Warm-start: opt16 best.pt (agg 0.2449); the whole local_field.temporal_operator subtree
# (incl. the new 3x3 spatial_coefficient) is missing from the parent -> created fresh &
# zero-gated via the rank-gated missing-prefix transfer (no shape conflict). Pinned parent
# for all 40 epochs = proven ~21.3 GiB epoch1/2 profile.
