# r5 tempop_warp_b1: WARP + LOW-RANK SCATTERING/AMPLITUDE OPERATOR (the sanctioned r5 stack).
#
# WHY: warp_r1 isolated the arrival-aligned characteristic warp and beat opt16 strict
# on BOTH metrics (fixed_full_time_panel ep8 agg 0.240138 / phase 0.799804 vs opt16
# strict 0.252999 / 0.784730). The warp repositions the PRIMARY arrival (transport),
# but the residual error concentrates in LAYERED media at LATE time (family layered
# 0.2888 worst; time_bin late 0.3432 worst) -- multiple reflections / reverberation
# that a single per-pixel advective shift cannot represent. This is exactly the r5
# continuation the warp config comment anticipates: "If warp works, r5 can stack warp
# + a scattering/amplitude corrector."
#
# MECHANISM (this run): stack the per-frame query-invariant temporal propagation
# operator (rank-8, spatial_kernel=3 receptive field) ON TOP of the trained warp.
# Rank-8 (not 16) per the local Codex 2026-07-30 brief, which explicitly recommends
# a "zero-initialized rank-8 cross-axis/spatial scattering corrector to the parent/
# warped field" as B1 when A1 conflicts with query invariance -- also the mem-frugal
# choice on the tight 23.5 GiB gate (rank intermediate ~0.3 GiB vs ~0.6 for rank-16).
# In LocalPropagationFieldGenerator.forward the ordering is operator-then-warp
# (field += operator(rendered,...); field = warp(field, rendered, arrival)): the
# operator adds bounded late scattered/reverberant AMPLITUDE where the energy already
# is, the warp then positions it. The operator gate is zero-init -> exact no-op at
# load, so warm-starting the warp ceiling is byte-reproducible (starts EXACTLY at the
# warp's metric, then the operator gates in).
#
# SINGLE FACTOR: the ONLY change vs warp_r1 is the added temporal operator. Warm-start
# is the WARP run's own checkpoint (warp params LOAD unchanged; only local_field.
# temporal_operator.* is allowlisted-missing -> fresh zero-init). So any agg/phase
# movement below the warp ceiling is attributable to the operator alone, on top of an
# already-arrival-aligned field -- a clean marginal test, NOT confounded with re-learning
# the warp. The operator gets its OWN LR group (temporal_operator_learning_rate) so it
# develops at full step while the converged parent (dense/local_field group) stays
# near-frozen at 5e-6 -- the staged-adapter warm-start protocol.
#
# FALSIFICATION (pre-registered switch gate, adopted from the local Codex 2026-07-30
# brief which independently corroborates this exact B1 design): vs the strict warp
# reference (fixed_full_time_panel: agg 0.240138, late tbin 0.3432, layered 0.2888),
# require by the ep12 strict panel agg < 0.240 AND late tbin < 0.30 AND layered < 0.27,
# while holding phase_correlation >= 0.80. If the operator only smooths (agg down but
# late tbin / layered / phase flat) it is NOT transport-completing -> drop, escalate to
# an explicit dynamic Green/scattering kernel (CODEX R5). This is only the switch gate;
# the unchanged hard goal remains agg < 0.05 and every family < 0.08.
#
# NOTE: launch ONLY after the warp ep12 strict verdict (ARCH_CANDIDATES decision
# coupling) so the parent best.pt is the warp ceiling and we do not fork a still-
# descending parent. parent_checkpoint below points at the warp run's best.pt.
artifact_dir: /root/autodl-tmp/home/jiayh/Data/FNO-Acoustic-Wave-Simulation/1/pretraining/local_field_w128_hicap/tempop_warp_b1
base_config: configs/grouped_v3/continuous_pilot_w128_legacy_norm.yaml
