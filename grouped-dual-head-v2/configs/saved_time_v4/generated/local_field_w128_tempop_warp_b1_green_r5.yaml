# R5 tempop_warp_b1_green_r5: WARP + rank-8 OPERATOR + DYNAMIC GREEN/SCATTERING KERNEL.
#
# STAGED ESCALATION -- launch ONLY if the B1 (tempop_warp_b1) ep12 STRICT panel fails
# the pre-registered switch gate, i.e. B1 shows AGG-ONLY SMOOTHING: aggregate falls but
# the late-time / layered residual and phase_correlation stay flat (agg down while late
# tbin >= 0.30 OR layered >= 0.27 OR phase < 0.80). That signature means the rank-8
# amplitude operator smooths energy but does not COMPLETE the transport of scattered/
# reverberant energy whose spatial support GROWS with elapsed travel time -- exactly what
# a single-radius operator structurally cannot do. R5 adds a bank of depthwise scattering
# stencils at increasing dilations (radii) with per-pixel, per-frame mixing weights biased
# by elapsed travel-progress, so the effective scattering support FOLLOWS travel time
# (GreenONet, Aldirany 2023; scattered-field decomposition, Ma & Alkhalifah 2025 -- local
# Codex 2026-07-30 web brief items #4/#5).
#
# SINGLE FACTOR: the ONLY change vs B1 is local_field_green_kernel: true. Warm-start is
# B1's OWN best.pt (warp + temporal_operator params LOAD unchanged; only local_field.
# green_kernel.* is allowlisted-missing -> fresh zero-init). The green kernel's gate is
# zero-init -> exact no-op at load, so R5 starts EXACTLY at B1's strict metric, then the
# kernel gates in. Any agg/late/layered/phase movement below B1's ceiling is attributable
# to the dynamic Green kernel alone -- a clean marginal test on top of an already
# arrival-aligned + amplitude-corrected field.
#
# STAGED-ADAPTER WARM START: green_kernel gets its OWN LR group
# (green_kernel_learning_rate 5e-5) so it develops at full step while the converged
# parent (dense/local_field group) stays near-frozen at 5e-6 and warp/temporal_operator
# (already trained in B1) also stay at the low dense rate -- the fresh adapter is the only
# thing moving at full step, the same protocol that fixed the B1 ep1->2 degradation.
#
# FALSIFICATION (pre-registered): vs the B1 strict ceiling, require by the ep12 strict
# panel that the dynamic kernel improves the transport-completion metrics the amplitude
# operator could not: late tbin < 0.30 AND layered < 0.27 while agg < B1-agg and phase
# >= 0.80. If the kernel too only smooths (agg down, late/layered/phase flat) the
# continuous-time scattering-operator family is exhausted for this backbone -> report and
# escalate to explicit wave-equation / eikonal structure. The unchanged hard goal remains
# agg < 0.05 and every family < 0.08.
#
# LAUNCH PREREQUISITE: B1 must have produced a strict best.pt (parent_checkpoint below
# points at B1's best.pt). Do NOT launch before the B1 ep12 strict verdict -- forking a
# still-descending parent would confound the single-factor test.
