# now only a tertiary readout. If layered/late stay pinned at the warp ceiling while only uniform twitches,
# the continuous-basis form is insufficient on the dominant error -> escalate to a stronger class-A (explicit
# space-time / wave-equation-structured coarse field). The unchanged hard goal remains agg < 0.05 and every
