# A3 enriches the WHOLE coarse field via a query-independent temporal basis, so its
# goal-relevant claim is that the continuous temporal basis lets a fixed (x,z) encode late/multi-arrival
# structure the single U-Net render cannot -- which must show up on the DOMINANT layered/marmousi late error.
# Require by the ep12 strict panel: LAYERED family_relative_l2 < 0.27 AND late tbin < 0.30 AND aggregate
