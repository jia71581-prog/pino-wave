# A3) AND B1's rank-8 temporal_operator are both UNDER-RANK for late-time reverberation -- which
# matches B1's flat layered/late. rank=32 covers ~99% of late-time layered+marmousi energy.
# CAVEAT: SVD bounds the FULL-field rank; the corrector acts on the residual (~24% rel-L2), whose
