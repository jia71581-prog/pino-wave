# param cost: temporal_latent 12,505 (r8) -> ~53k (r32), still <1% of the 5.67M base; gate=0.0 (no-op).
# SINGLE FACTOR vs registered A3: ONLY local_field_temporal_latent_rank changes (8->32); harmonics,
# parent (warp_r1 best.pt), LR groups, panels all identical. Launch on a free GPU / after B1 verdict.
#
# A3 temporal_latent (CLASS-A coarse-field lever): continuous temporal LATENT BASIS.
#
# WHY (CORRECTED 2026-07-30 ~11:55, split RE-VERIFIED ~12:20 -- the earlier ceiling-bound rationale
# was RETRACTED): the strict aggregate is the equal-RECORD-weighted mean of per-record rel-L2
# (streaming_metrics.py:227, reconstructs 0.23978 exactly). The strict panel is 48 records, VERIFIED
# from warp_r1 metrics as LAYERED n=19 / MARMOUSI n=19 / uniform n=10 (39.6/39.6/20.8%; integer-solved
# err 1.1e-4). So the aggregate is CO-DOMINATED by layered+marmousi (~79% together), NOT gated by uniform
# (~21%). The prior claim -- "uniform floors the aggregate at 0.126 >> 0.05 so only a class-A lever can
# reach the goal" -- assumed 0.126 was a universal per-family floor; it is not, and class-B is NOT useless.
# Class-B correctors (B1 tempop, R5 green) DIRECTLY target the dominant layered+marmousi scattering and are
# on-target. A3 is therefore NOT "the only goal-critical path" -- it is a LEGITIMATE PARALLEL class-A option:
# it enriches the COARSE field itself with a low-rank continuous temporal basis so a fixed (x,z) can encode
# multi-arrival / late-time structure a single time-conditioned U-Net render cannot, and to matter it must
# move the DOMINANT layered/marmousi late error (see re-keyed gate).
#
# MECHANISM: a bank of M=rank query-INDEPENDENT spatial anchor maps L_m(x,z) built from the
# record-level, time-INDEPENDENT conditioning (medium pyramid + source), SHARED across every
# saved time, combined with continuous per-frame coefficients w_m(t,tau):
#     coarse(x,z,t) += gate * sum_m w_m(t,tau) * L_m(x,z) / sqrt(M).
# Because the anchors do not depend on t and each frame uses only its own (t,tau), per-frame
# query invariance holds BY CONSTRUCTION (no queried-index-axis mixing -- this resolves the
# A1 contract blocker). Anchors are computed ONCE per record (not per frame) and there is no
# K-frame U-Net re-render, so the extra activation is ~M channels per record, not K renders
# (resolves the A1 memory blocker; strictly cheaper than B1's tempop). Gate is zero-init ->
# exact warm-start no-op, so loading the warp ceiling is byte-reproducible (starts EXACTLY at
# the warp metric, then A3 gates in).
#
# SINGLE FACTOR: warm-start is the WARP run's own best.pt (identical parent as B1). warp
# params LOAD unchanged and are held near-frozen (warp has NO own LR group here -> dense
# group at 5e-6), so the ONLY thing developing at full step is local_field.temporal_latent.*
# (allowlisted-missing -> fresh zero-init, its OWN LR group at 5e-5). Any movement below the
# warp ceiling is attributable to A3 alone, on an already-arrival-aligned field -- a clean
# marginal CLASS-A test, the sibling of B1 (which added the class-B temporal_operator instead).
#
# FALSIFICATION (pre-registered, RE-KEYED 2026-07-30 ~11:55 after the ceiling-bound retraction; split
# RE-VERIFIED ~12:20 from warp_r1 metrics): vs the strict warp reference (fixed_full_time_panel ep12:
