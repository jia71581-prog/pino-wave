# JUSTIFICATION (CPU data diagnostic 2026-07-30 ~14:15, ground-truth SVD of the VALIDATION-split
# wavefields, dataset_v1.h5): the space x time rank of the LATE-time (frames 160:401) fields is
# layered 90%=17.5 / 99%=32.7 modes, marmousi 90%=22 / 99%=33, uniform 90%=14 / 99%=24 (mean over
