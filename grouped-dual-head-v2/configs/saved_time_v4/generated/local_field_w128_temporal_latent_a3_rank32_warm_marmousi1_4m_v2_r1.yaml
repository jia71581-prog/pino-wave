parent_checkpoint_identity: /root/autodl-tmp/home/jiayh/Data/FNO-Acoustic-Wave-Simulation/1/pretraining/local_field_w128_hicap/warp_r1/run/run_identity.json
parent_identity: configs/saved_time_v4/generated/w2_parent_identity_legacy_norm_marmousi1_4m_v2.json
prefetch_factor: 4
query_points: 1
seed: 372
time_appearance_offset: 15
time_policy: appearance16
training_frames_per_record: 24
travel_time_h5: /home/jiayh/Data/data/processed/hybrid_travel_layered_eikonal_ray12_marmousi1_4m_v2.h5
