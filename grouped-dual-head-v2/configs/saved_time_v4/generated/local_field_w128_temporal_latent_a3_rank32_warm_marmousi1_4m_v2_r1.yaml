    coordinate_encoder: 5.0
    default: 1.0
    dense_decoder: 20.0
    fusion: 5.0
    local_field: 80.0
    medium_encoder: 2.0
    source_encoder: 5.0
    travel_branch: 5.0
  minimum_factor: 0.1
  schedule_epoch_offset: 0
  schedule_total_epochs: 40
  training_time_block: 1
  warmup_epochs: 2
  weight_decay: 1.0e-6
