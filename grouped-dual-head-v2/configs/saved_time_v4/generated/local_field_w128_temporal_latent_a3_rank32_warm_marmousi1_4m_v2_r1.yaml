# Data-repaired continuation of the pre-registered A3-WARM rank-32 branch.
# The model/optimizer/sampling recipe is identical to A3-WARM; only the data
# binding, derived travel cache, explicit cross-manifest weight transfer and
# collision-free artifact directory differ.
artifact_dir: /root/autodl-tmp/home/jiayh/Data/FNO-Acoustic-Wave-Simulation/1/pretraining/local_field_w128_hicap/temporal_latent_a3_rank32_warm_marmousi1_4m_v2_r1
base_config: configs/grouped_v3/continuous_pilot_w128_legacy_norm_marmousi1_4m_v2.yaml
checkpoint_keep_last: 5
checkpoint_transfer:
  allow_new_local_field_parameters: false
  allow_parent_manifest_mismatch: true
  parent_optimizer_state: false
pin_trainable_prefixes: [dense_decoder, local_field, source_encoder, fusion]
energy_floor_fraction: 0.01
epochs: 40
family_gradient_weights: {layered: 1.0, marmousi: 1.0, uniform: 1.0}
