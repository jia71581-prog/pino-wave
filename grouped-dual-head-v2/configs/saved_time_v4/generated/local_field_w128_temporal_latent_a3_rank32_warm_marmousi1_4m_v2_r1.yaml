  spectrum: 0.1
  temporal_difference: 0.1
  per_frame_frame: true
  frame_energy_floor_fraction: 0.05
  late_frame_gain: 2.0
  late_frame_start_fraction: 0.4
macro_records: 8
macros_per_update: 4
microbatch_records: 1
optimizer:
  adamw_implementation: fused
  backbone_learning_rate: 5.0e-7
  dense_learning_rate: 5.0e-6
  temporal_latent_learning_rate: 5.0e-5
  full_forward_checkpointing: false
  geometry_learning_rate: 1.0e-6
  gradient_clip: 1.0
  gradient_clip_mode: prefix_limits
