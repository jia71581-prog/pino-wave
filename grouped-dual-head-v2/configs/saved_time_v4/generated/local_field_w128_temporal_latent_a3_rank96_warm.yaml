# local_field_temporal_latent_rank 64 -> 96.  gate_init 0.03, parent warp_r1, LR groups, panels,
# seed (372) all IDENTICAL to rank64_warm / rank32_warm.
#
# WHY THIS RUN EXISTS (2026-07-30 R8+12, warp_r1 residual oracle = residual_rank_full.json,
# --checkpoint warp_r1/run/best.pt, late frames 160-400, 4 rec/family, PROVENANCE-CONFIRMED):
# the oracle proves the BINDING CONSTRAINT ON ANY ADDITIVE RESIDUAL CORRECTOR IS TEMPORAL RANK,
# not separability -- shared-basis and per-record floors are near-identical at every rank
# (layered rank32 shared 0.141 / perrec 0.126; rank64 0.059 / 0.052).  The optimistic separable
# floors on the late window:
#     rank  layered   marmousi  uniform
#      8    0.319     0.154     0.069
#     32    0.141     0.080     0.036
#     48    0.086     0.061     0.029
#     64    0.059     0.052     0.023
# So rank-8 (B1) is HOPELESS (layered 0.32); the family target (<0.08) first opens up at rank~48-64;
# and <0.05 needs rank >= 64 even at the per-record SVD optimum.  rank64_warm is the frontier;
# THIS rank96 run tests whether pushing past 64 buys the last stretch layered/marmousi 0.05-0.06 ->
# <0.05, or whether the learned basis saturates short of the SVD optimum (diminishing returns).
#
# GATED LAUNCH: run ONLY if rank64_warm's ep12 strict panel confirms the temporal-latent basis is
# ACTUALLY developing (gate opened, layered late < 0.10, monotone improvement) AND tops out in the
# 0.05-0.08 band (i.e. rank is the binding knob, worth escalating).  If rank64_warm instead stalls
# at the warp ceiling (~0.235) -> the deadlock/optimization, not rank, is the problem -> do NOT
# escalate rank; fix training first.  If rank64_warm already reaches <0.05 -> goal met, no rank96.
#
# HONEST EXPECTATION (pre-registered): the oracle's rank-64 optimistic floor is 0.052-0.059 on
# layered/marmousi LATE; a generalizing learned basis will not beat the per-sample SVD optimum, so
# rank96 realistically lands ~0.05-0.07 late.  agg<0.05 (all-frame) is plausible ONLY because early
# frames are near-perfect under warp_r1; if rank96's late window stays > 0.06 the additive-residual
# family is ceiling-bound and the true path to <0.05 is a structurally different parent (the warp
# residual is genuinely high-rank in time on layered/marmousi late = multi-arrival a single render
# cannot encode), NOT more rank.  This run is the clean test of that fork.
#
# MEMORY: rank 64->96 grows only the temporal_latent basis (anchor maps + rank-channel field),
# tiny vs the U-Net; peak still gated by maximum_peak_cuda_gib 23.5 + 2-epoch pilot gate.  Smoke
# (>=3 val->train boundaries, no OOM/NaN) before full run.
