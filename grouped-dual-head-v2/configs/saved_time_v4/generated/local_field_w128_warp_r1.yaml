# r4 warp_r1: ARRIVAL-ALIGNED CHARACTERISTIC WARP (transport pivot).
#
# WHY: r2 (rank-16 temporal operator, staged-adapter) and its r3 receptive-field
# variant both attack the wavefront-position bottleneck by RESHAPING amplitude where
# the energy already is. r2 confirmed a plateau at the opt16 floor (agg ~0.2449,
# phase flat ~0.797): the aggregate improvement it did earn (full-panel 0.2530 ->
# 0.2411) was amplitude-driven, NOT transport -- phase_correlation never moved. A
# pointwise (and even a small receptive-field) operator cannot fix a DISPLACEMENT.
#
# MECHANISM (this run): local_field_warp resamples the rendered coarse field along
# the propagation characteristic d = grad(T)/||grad(T)|| (T = eikonal first-arrival,
# already computed as travel.seconds) by a bounded per-pixel zero-init shift
# s(t,x,z):  u_warp(x,z) = u((x,z) - s*d).  Moving energy along the ray is exactly
# the degree of freedom needed to reposition the wavefront (Lanthaler shift-DeepONet
# ICLR 2023; Song PIFNO eikonal-characteristic 2023). Applied to the field just
# before the causal gate; the zero-init shift head makes it an EXACT no-op at load.
#
# SINGLE FACTOR: warp only. NO temporal operator (rank 0) -- this isolates the
# transport contribution against the SAME opt16 parent used by r2/r3, so any agg/phase
# movement is attributable to the warp alone (not confounded with the r3 RF amplitude
# operator). If warp works, r5 can stack warp + a scattering/amplitude corrector.
#
# FALSIFICATION: co-primary gate -- require agg < 0.2449 AND phase_correlation up
# (arrival/onset-MAE + xcorr peak-shift down). Agg-alone improvement without phase
# recovery is amplitude smoothing, not transport, and does NOT confirm the mechanism.
# If the bounded warp cannot move phase, the position error is not a smooth advection
# along grad(T) (e.g. multipathing / reflection geometry) -> escalate to r5 dynamic
# Green/scattering kernel.
#
# Warm-start: opt16 best.pt (agg 0.2449). The whole local_field.warp subtree is
# missing from the parent -> created fresh & zero-init via the warp missing-prefix
# transfer (no shape conflict). Pinned parent for all 40 epochs (proven ~21.3 GiB
# epoch1/2 profile; warp adds one 3x3 head + a grid_sample, negligible memory).
