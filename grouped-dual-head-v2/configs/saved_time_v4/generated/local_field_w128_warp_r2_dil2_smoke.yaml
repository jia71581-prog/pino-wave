# r4b warp_r2 (controlled A2): WIDER-RECEPTIVE-FIELD arrival-aligned warp.
#
# WHY: warp_r1 (opt16 parent, dilation=1, RF=5 shift head) is the current best
# TRANSPORT checkpoint -- fixed_full_time_panel ep12 agg=0.23978, phase=0.79694,
# layered=0.28785 (worst family), marmousi=0.25165, uniform=0.12590. It moved agg a
# little below the opt16 amplitude floor but phase stayed ~0.797 and the layered
# family barely budged. A wavefront DISPLACEMENT is a function of SURROUNDING
# structure (neighbouring interfaces, the local ray geometry), not a single pixel;
# an RF=5 shift head can only read a 5x5 patch of rendered features and may be unable
# to estimate the correct displacement for the layered reflectors that dominate the
# residual.
#
# MECHANISM (this run): identical to warp_r1 EXCEPT the shift head's two 3x3 convs
# are DILATED by 2 (local_field_warp_shift_dilation: 2), widening its receptive field
# from 5x5 to 9x9 at ZERO extra parameters and ZERO extra activation memory (the 3x3
# kernels keep their shape; padding=dilation preserves H,W). This is the ONLY change
# vs warp_r1 -- same opt16 parent, same zero-init (exact no-op at load), same LRs,
# same losses, same adaptive sampling. Any agg/phase movement is therefore
# attributable to the shift head's receptive field alone (a controlled A2, not a new
# module).
#
# SINGLE FACTOR: warp_shift_dilation 1 -> 2. NO temporal operator (rank 0), no
# multi_arrival, no green kernel. Directly comparable to warp_r1 which shares this
# exact config with dilation=1.
#
# FALSIFICATION (co-primary gate vs warp_r1 ep12): require agg < 0.23978 AND phase
# up (>= warp_r1's 0.79694, ideally toward 0.80) AND layered < 0.2878. An agg-alone
# improvement without phase/layered recovery is amplitude smoothing from the wider
# blur, NOT better transport, and does NOT confirm the mechanism. If a 9x9 shift head
# still cannot move layered phase, the position error is not a smooth advection along
# grad(T) that a wider linear RF can resolve (multipathing / reflection geometry) ->
# escalate to the multi_arrival mixture (A4) or the r5 dynamic scattering kernel.
#
# Warm-start: opt16 best.pt (agg 0.2449), SAME parent as warp_r1. The whole
# local_field.warp subtree is missing from the parent -> created fresh & zero-init via
# the warp missing-prefix transfer (no shape conflict; dilation does not change weight
# shape). Pinned parent for all 40 epochs (warp_r1 proved ~21.7 GiB; a dilated 3x3
# head adds no memory over dilation=1).
