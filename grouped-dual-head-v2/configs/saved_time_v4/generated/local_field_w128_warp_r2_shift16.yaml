# r4c warp_r2_shift16 (controlled A2, EVIDENCE-DRIVEN): RAISE the transport bound.
#
# WHY (measured, not guessed): warp_r1 ep12 fixed_full_time_panel logged
# xcorr_peak_shift_cells=7.023 (mean wavefront translation) and
# centroid_shift_cells=17.42, while the warp shift is HARD-BOUNDED at
# max_shift_cells=8.0. The mean wavefront shift is 88% of the bound and the centroid
# displacement exceeds it ~2x -> the +-8-cell clamp is (near-)binding on the residual
# the model still carries (layered 0.2879 worst family, late tbin 0.3452 worst bin).
# A bounded warp cannot move energy the distance the data demands; raising the bound
# is the most directly evidence-supported single factor. This is prioritized ABOVE
# the receptive-field dilation variant (warp_r2_dil2): dilation widens what the head
# SEES to decide a shift, but cannot help energy CLAMPED at 8 cells that needs to
# travel further.
#
# MECHANISM: identical to warp_r1 EXCEPT local_field_warp_max_shift_cells 8.0 -> 16.0.
# The shift head is unchanged and still zero-init -> s=0 at load -> EXACT no-op at
# warm-start (tanh(0)=0 regardless of the bound; verified). Larger bound only widens
# the reachable displacement range as the head learns.
#
# SINGLE FACTOR: max_shift_cells 8 -> 16. Same opt16 parent as warp_r1, same zero-init,
# LRs, losses, adaptive sampling. Directly comparable to warp_r1 (dilation=1, bound=8).
#
# FALSIFICATION (co-primary vs warp_r1 ep12 agg=0.23978 phase=0.79694 layered=0.28785,
# xcorr_shift=7.023): PASS = agg<0.23978 AND phase>=0.79694 AND layered<0.2878, with
# xcorr_peak_shift_cells free to exceed 8 (confirming the bound WAS binding). If agg/
# phase/layered stay flat AND learned shifts remain <8, the +-8 bound was NOT the
# limiter -> the position error is not a longer smooth advection (multipathing) ->
# escalate to A4 multi_arrival mixture / r5 scattering. If shifts saturate the new 16
# bound too, raise again or switch to mixture paths.
#
# Warm-start: opt16 best.pt (agg 0.2449), SAME parent as warp_r1. warp subtree missing
# -> fresh zero-init via missing-prefix transfer (bound does not change weight shape).
# Memory: identical to warp_r1 (~21.7 GiB); a scalar bound adds nothing. Cap 23.5 GiB.
