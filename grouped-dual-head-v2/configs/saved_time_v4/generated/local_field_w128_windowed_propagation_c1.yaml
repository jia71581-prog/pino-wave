# C1 windowed_propagation (contract-safe small-window SPACE-TIME lever): characteristic
# advection over a DETERMINISTIC neighbor-time window.
#
# STATUS: LAUNCH-READY. Pre-registered escalation after the A4 (multi_arrival) ep4 STRICT
# falsification (2026-07-31): warp->A3->A4 additive-corrector ladder all stalled at the warp
# ceiling with aggregate-only smoothing (gate does not open, per-family layered late-bin
# pinned, phase < 0.80). The verdict pointed to an EXPLICIT space-time-structured coarse field.
#
# WHY C1 (space-time coupling, contract-safe): every prior temporal module corrects frame i
# from frame i's OWN scalar time -- diagonal in the queried-time axis, so NO propagation
# dynamics tie the wavefront position across saved times (the root cause of the position/phase
# floor and the 0.125 overfit floor). C1 introduces the first genuine reduce over a
# DETERMINISTICALLY-constructed neighbor-time window: for output frame i at saved index k_i it
# builds a window {clamp(k_i + delta, 0, N-1) : delta in [-w, w]} (a function of k_i ALONE),
# advects frame i's own (already warp-corrected) field along the eikonal characteristic
# grad(T) to each neighbor time (NO extra U-Net render), and couples the D snapshots with a
# learned bilinear space-time operator. This physically ADVECTS the front (a continuous shift
# per Delta_t) and learns which advected neighbor snapshots compose the center frame -- tying
# front position across saved times, which B1's 1x1 (zero receptive field, amplitude-only)
# structurally cannot.
#
# QUERY-INVARIANCE CONTRACT (verified by tests): the window for frame i depends only on k_i;
# the advected snapshots only on field_in[:, i] (frame i itself; the warp is query-invariant)
# and the static arrival; coeff only on frame i's Delta_t; the spatial basis only on frame i's
# render. So a single-frame (count=1) query rebuilds an identical window and is bit-identical
# to that frame inside a multi-frame batch (test_full_forward_per_frame_query_invariance).
# No reduce over the queried-frame axis; no autoregression.
#
# OPTION-B WARM-START (byte-reproducible warp ceiling): C1 is ADDITIVE on the warp-corrected
# field; the center tap Delta_t=0 reproduces the field, so at gate_init=0 field_out == field_in
# EXACTLY -- starts at the loaded 0.2398 warp ceiling, only fresh local_field.windowed_propagation.*
# develops. Launch uses gate_init 0.02 (small positive) to break the A4 cold-start deadlock: the
# space/time sub-nets are NOT zero-init, so they receive real gradient the moment the gate opens.
#
# SINGLE FACTOR vs warp_r1 parent: ONLY local_field_windowed_propagation is newly enabled. warp,
# residual, panels, LR groups identical. warp.* loads unchanged in the near-frozen dense group
# (5e-6); windowed_propagation.* is the only thing at full step (own group 5e-5). Any movement
# below the warp ceiling is attributable to C1 alone.
#
# MEMORY: NO extra U-Net render (advection is grid_sample on the existing field); the (R,T,D,H,W)
# window tensor is ~52MB. With training_frames_per_record 16 + full_forward_checkpointing (the
# A4 setting), predicted peak ~15.7-17 GiB < 23.5. 401-frame validation is frame-chunked (bounded).
#
# FALSIFICATION (pre-registered, same strict warp reference): vs warp ep12 strict
# (agg 0.2398, LAYERED 0.2878, MARMOUSI 0.2516, late tbin 0.3452, phase 0.7969).
# PASS by the ep12 strict panel: aggregate < 0.235 AND phase >= 0.82 (the direct position/phase
# readout, up from 0.797) AND late tbin < 0.31, no family regressing > 5% (strong PASS if
# LAYERED < 0.27 AND MARMOUSI < 0.24). If the gate is clearly training (leaves 0.02, internals
# get gradient) but phase stays <= 0.80 and late tbin >= 0.34, small-window temporal coupling is
# NOT the missing lever -> escalate to an explicit wave-equation-structured coarse field.
# Unchanged hard goal: agg < 0.05 and every family < 0.08.
