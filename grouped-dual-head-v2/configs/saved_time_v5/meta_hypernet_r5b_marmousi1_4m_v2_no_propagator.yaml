# Train-only meta initialization plus per-instance latent fine-tuning for the
# frozen r5b neural operator.  This profile deliberately excludes every
# external/numerical wavefield propagator.  Future wavefields may supervise the
# shared adapter on train records only; deployment sees exactly the two guarded
# onset snapshots and optimizes only latent_delta plus residual_gate.
source_h5: /data/jiayh/data/acoustic_lwc84_2km_401x401_to_201_marmousi1_4m_v2/dataset_v1.h5
parent_kind: saved_time_v4
parent_operator_config: configs/saved_time_v4/generated/local_field_w128_temporal_latent_a3_rank32_r5b_train_gate_record_l2_diag.yaml
parent_checkpoint: /root/autodl-tmp/home/jiayh/Data/FNO-Acoustic-Wave-Simulation/1/pretraining/local_field_w128_hicap/temporal_latent_a3_rank32_r5b_train_gate_record_l2_diag/run/checkpoints/epoch_0003.pt
parent_checkpoint_identity: /root/autodl-tmp/home/jiayh/Data/FNO-Acoustic-Wave-Simulation/1/pretraining/local_field_w128_hicap/temporal_latent_a3_rank32_r5b_train_gate_record_l2_diag/run/run_identity.json
# Legacy Boolean policy: 1 preserves the checkpoint's learned correction
# amplitude; 0 is a coarse-only ablation.
parent_correction_scale: 1.0
normalization_json: /home/jiayh/Data/data/processed/grouped_v3_normalization_marmousi1_4m_v2_checkpoint_compatible.json
travel_time_h5: /home/jiayh/Data/data/processed/hybrid_travel_layered_eikonal_ray12_marmousi1_4m_v2.h5

seed: 372
latent_dim: 32
lora_rank: 4

# Offline training is invoked with --physics-weight 0.0.  There is no
# background provider, pseudo-label bridge, numerical rollout, or solver call.
require_parent_binding: true

# Deployment instance fine-tuning.  The frozen shared conditioner/residual
# initializes the instance, then only 33 scalars (32 latent shifts plus one
# residual gate) are updated from the two permitted onset snapshots.
adaptation_optimizer: adam_lbfgs
adam_steps: 8
lbfgs_steps: 2
learning_rate: 2.0e-4
deployment_pde_weight: 0.0
hard_project_onset: false
minimum_energy_ratio: 0.8
maximum_energy_ratio: 1.25

# Retained only to make the zero-PDE deployment path explicit and reproducible;
# these samples are never built when deployment_pde_weight is zero.
physics_sampling:
  method: uniform
  k: 1.0
  c: 1.0
  time_tilt: 0.0
  resample_every: 1
