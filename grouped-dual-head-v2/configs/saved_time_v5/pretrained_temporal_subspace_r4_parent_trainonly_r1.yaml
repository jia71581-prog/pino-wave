parent_checkpoint: /root/autodl-tmp/home/jiayh/Data/FNO-Acoustic-Wave-Simulation/1/pretraining/a3_alltrain_rel_l2_pde_pml_ic_current_vds_r4/run/checkpoints/epoch_0007.pt
parent_checkpoint_identity: /root/autodl-tmp/home/jiayh/Data/FNO-Acoustic-Wave-Simulation/1/pretraining/a3_alltrain_rel_l2_pde_pml_ic_current_vds_r4/run/run_identity.json
parent_correction_scale: 1.0
normalization_json: /home/jiayh/Data/data/processed/grouped_v3_normalization_marmousi1_4m_v2_checkpoint_compatible.json
travel_time_h5: /home/jiayh/Data/data/processed/hybrid_travel_layered_eikonal_ray12_marmousi1_4m_v2.h5

seed: 372
dt_s: 0.0025
dx_m: 10.0
dz_m: 10.0
bridge_steps: 4
causal_ramp_steps: 6

# This route does not train a new error-basis network. It extracts the frozen
# parent's rank-32 temporal latent Jacobian basis and solves only its instance
# coefficients. per_family is used solely to keep pilot records disjoint from
# the historical basis-training census selected by the common data contract.
cpadc:
  rank: 32
  per_family: 32
  physics_point_count: 256
  rank_chunk_size: 4

# Two observed onset frames are hard-preserved by the causal basis. A strong
# probe weight nevertheless aligns the reduced design with those observations,
# while defect and synthetic bridge terms constrain unobserved evolution.
inner_weights:
  defect: 1.0
  observed: 100.0
  bridge: 0.5
  prior: 1.0e-4
inner_spatial_stride: 4

rad_k: 1.0
rad_c: 1.0
rad_time_tilt: 2.0

deployment_gate:
  minimum_causal_objective_improvement: 0.001
  maximum_condition_number: 1.0e8
  maximum_correction_ratio: 0.10
  maximum_runtime_s: 3.0
  minimum_blind_mean_improvement: 0.01
  minimum_nonworse_fraction: 0.95
  require_every_family_nonworse: true

